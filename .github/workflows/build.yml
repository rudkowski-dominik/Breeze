name: Build Breeze

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Application and DMG
        run: |
          chmod +x scripts/*.sh
          ./scripts/build.sh
          ./scripts/create-dmg.sh

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Breeze-DMG
          path: Breeze-1.0.0.dmg
